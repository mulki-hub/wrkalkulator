<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator WR MLBB & Global Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://i.supaimg.com/bea0082f-9e9b-4a6a-b78b-65037e9a964e/da6c4c40-a08e-4c8b-8bd7-94afe930c231.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #ffffff; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
        }

        /* HEADER PROFIL & SETTING */
        .header-bar {
            position: absolute; top: 15px; left: 15px; right: 15px; display: flex;
            justify-content: space-between; align-items: center; background: rgba(20, 20, 20, 0.7);
            padding: 10px 15px; border-radius: 12px; backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1); z-index: 10;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #ffcc00; }
        .username-text { font-size: 15px; font-weight: bold; color: #ffcc00; text-shadow: 0 0 5px rgba(255, 204, 0, 0.4); display: flex; align-items: center; gap: 5px; }
        .badge-adm { background: #ff3333; color: white; font-size: 10px; padding: 2px 5px; border-radius: 4px; text-shadow: none; font-weight: bold; }
        
        .header-buttons { display: flex; gap: 8px; }
        .action-btn { background: rgba(40, 40, 40, 0.8); border: 1px solid #444; color: #fff; font-size: 18px; cursor: pointer; padding: 5px 10px; border-radius: 8px; transition: 0.2s; }
        .action-btn:hover { color: #ffcc00; border-color: #ffcc00; transform: scale(1.05); }

        /* HALAMAN UTAMA (KALKULATOR WR) */
        .container {
            position: relative; background: rgba(20, 20, 20, 0.65); padding: 25px; border-radius: 15px;
            width: 100%; max-width: 400px; backdrop-filter: blur(8px); z-index: 1;
            animation: neonGlow 3s infinite alternate; margin-top: 50px;
        }
        .container::before {
            content: ""; position: absolute; inset: -3px; border-radius: 18px; padding: 3px;
            background: linear-gradient(45deg, #ff0055, #0055ff, #ff0055, #0055ff);
            background-size: 300% 300%; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; z-index: -1; animation: moveGradient 3s linear infinite;
        }
        @keyframes moveGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes neonGlow { 0% { box-shadow: 0 0 15px rgba(255, 0, 85, 0.4), inset 0 0 10px rgba(0, 85, 255, 0.3); } 100% { box-shadow: 0 0 15px rgba(0, 85, 255, 0.4), inset 0 0 10px rgba(255, 0, 85, 0.3); } }
        
        h2 { text-align: center; margin-bottom: 20px; color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #eeeeee; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 8px; background-color: rgba(40, 40, 40, 0.7); color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #ffcc00; box-shadow: 0 0 8px rgba(255, 204, 0, 0.5); }
        button.main-btn { width: 100%; padding: 12px; background: linear-gradient(90deg, #ff8c00, #ffcc00); color: #121212; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .result-box { margin-top: 15px; padding: 15px; background-color: rgba(40, 40, 40, 0.7); border: 1px solid #444; border-radius: 8px; display: none; backdrop-filter: blur(5px); }
        .result-item { margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
        .highlight { color: #ffcc00; font-weight: bold; text-shadow: 0 0 5px rgba(255, 204, 0, 0.5); }
        .highlight-red { color: #ff3333; font-weight: bold; text-shadow: 0 0 5px rgba(255, 51, 51, 0.5); }

        /* HALAMAN GLOBAL CHAT */
        .chat-container {
            display: none; position: relative; background: rgba(20, 20, 20, 0.75); padding: 15px;
            border-radius: 15px; width: 100%; max-width: 450px; height: 75vh; backdrop-filter: blur(8px);
            flex-direction: column; z-index: 1; margin-top: 50px; border: 1px solid rgba(0, 114, 255, 0.4); box-shadow: 0 0 15px rgba(0, 85, 255, 0.3);
        }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #444; margin-bottom: 10px; }
        .chat-bubble { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; background: rgba(40, 40, 40, 0.8); padding: 8px 12px; border-radius: 10px; word-break: break-word; }
        .chat-user-info { display: flex; gap: 10px; align-items: flex-start; }
        .chat-bubble img.ava { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #ffcc00; flex-shrink: 0; }
        .chat-content { display: flex; flex-direction: column; }
        
        .chat-quoted { background: rgba(255, 255, 255, 0.1); border-left: 3px solid #00c6ff; padding: 4px 8px; font-size: 11px; color: #bbb; border-radius: 4px; margin-bottom: 4px; }
        .reply-preview-box { display: none; background: rgba(0, 85, 255, 0.2); border-left: 3px solid #0055ff; padding: 6px 10px; border-radius: 4px; margin-bottom: 5px; font-size: 12px; position: relative; }
        .reply-preview-box .close-btn { position: absolute; right: 5px; top: 5px; cursor: pointer; color: #ff3333; font-weight: bold; background: none; border: none; font-size: 14px; }
        .action-row { display: flex; gap: 10px; margin-top: 4px; }
        .btn-reply { background: none; border: none; color: #00c6ff; font-size: 11px; cursor: pointer; padding: 0; font-weight: bold; }
        
        .chat-user { font-size: 12px; color: #ffcc00; font-weight: bold; margin-bottom: 2px; display: flex; align-items: center; gap: 5px; }
        .chat-text { font-size: 14px; color: #fff; }
        .chat-emote { max-width: 70px; max-height: 70px; border-radius: 8px; margin-top: 3px; }
        .delete-msg-btn { background: #ff3333; color: white; border: none; border-radius: 4px; padding: 2px 6px; font-size: 11px; cursor: pointer; display: none; }

        .chat-input-area { display: flex; flex-direction: column; gap: 5px; position: relative; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input { flex: 1; padding: 10px; border: 1px solid #444; border-radius: 8px; background-color: rgba(40, 40, 40, 0.8); color: #fff; outline: none; }
        .chat-input-row button { padding: 0 15px; background: #0055ff; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-emote-toggle { padding: 0 10px !important; background: #2a2a2a !important; border: 1px solid #444 !important; font-size: 18px; }
        .char-counter { font-size: 11px; color: #aaa; text-align: right; }

        .emote-picker { display: none; position: absolute; bottom: 50px; right: 80px; background: rgba(30, 30, 30, 0.95); padding: 10px; border-radius: 10px; border: 1px solid #444; gap: 8px; flex-wrap: wrap; width: 180px; z-index: 100; backdrop-filter: blur(5px); }
        .emote-picker img { width: 45px; height: 45px; border-radius: 5px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .emote-picker img:hover { transform: scale(1.15); border-color: #ffcc00; }

        .nav-float-btn { position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; background: linear-gradient(45deg, #0055ff, #00c6ff); border: none; border-radius: 50%; color: white; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 85, 255, 0.5); display: flex; justify-content: center; align-items: center; z-index: 100; transition: 0.3s; }
        .nav-float-btn:hover { transform: scale(1.1); }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #444; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto; }
        .modal-content h3 { color: #ffcc00; text-align: center; font-size: 18px; }
        .modal-content input[type="text"], .modal-content input[type="password"], .modal-content textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; outline: none; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-save { background: #ffcc00; color: #121212; }
        .btn-cancel { background: #444; color: white; }
        
        .admin-box { background: #252525; border-radius: 8px; padding: 10px; border: 1px solid #333; margin-bottom: 10px; }
        .admin-chat-item { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 8px; border-radius: 6px; font-size: 12px; border-left: 3px solid #ff3333; margin-bottom: 5px; }
        .admin-fb-item { background: #1a1a1a; padding: 10px; border-radius: 6px; font-size: 12px; border-left: 3px solid #00c6ff; margin-bottom: 8px; }
        .fb-date { font-size: 10px; color: #888; float: right; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="user-info">
            <img id="headerAvatar" class="avatar-img" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png">
            <span id="headerUsername" class="username-text">guest123</span>
        </div>
        <div class="header-buttons">
            <button class="action-btn" onclick="openFeedback()" title="Kirim Saran">💡</button>
            <button class="action-btn" id="adminPanelBtn" onclick="openAdminPanel()" title="Panel Admin" style="display: none;">🛡️</button>
            <button class="action-btn" onclick="openSettings()" title="Pengaturan Profil">⚙️</button>
        </div>
    </div>

    <!-- KALKULATOR WR -->
    <div class="container" id="calcPage">
        <h2>Kalkulator WR MLBB</h2>
        <div class="input-group">
            <label>Jumlah Match Saat Ini</label>
            <input type="number" id="totalMatch" placeholder="Contoh: 150" min="1">
        </div>
        <div class="input-group">
            <label>WR Saat Ini (%)</label>
            <input type="number" id="currentWR" placeholder="Contoh: 57" step="any">
        </div>
        <div class="input-group">
            <label>WR Tujuan (%)</label>
            <input type="number" id="targetWR" placeholder="Contoh: 60" step="any">
        </div>
        <div class="input-group">
            <label>Simulasi Kekalahan Beruntun (Opsional)</label>
            <input type="number" id="loseStreak" placeholder="Contoh: 3 (Jika kalah 3x berturut-turut)">
        </div>
        <button class="main-btn" onclick="hitungWR()">Cek & Hitung</button>
        
        <div class="result-box" id="resultBox">
            <div class="result-item" id="winLoseResult"></div>
            <div class="result-item" id="simulationResult" style="display:none; padding:10px; background:rgba(255,51,51,0.1); border-left:3px solid #ff3333; border-radius:4px; margin-top:10px;"></div>
            <div class="result-item" id="targetResult" style="margin-top:10px;"></div>
        </div>
    </div>

    <!-- GLOBAL CHAT -->
    <div class="chat-container" id="chatPage">
        <h2 style="font-size: 18px; margin-bottom: 10px; text-align: center; color: #00c6ff;">Global Chat</h2>
        <div class="chat-messages" id="chatMessages"></div>
        
        <div class="reply-preview-box" id="replyPreviewBox">
            <button class="close-btn" onclick="cancelReply()">✖</button>
            <div style="color: #00c6ff; font-weight: bold; margin-bottom: 2px;" id="replyPreviewUser">@User</div>
            <div style="color: #ccc;" id="replyPreviewText">Pesan...</div>
        </div>

        <div class="chat-input-area">
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Ketik pesan..." maxlength="50" oninput="updateCharCount()">
                <button class="btn-emote-toggle" onclick="toggleEmotePicker()">😃</button>
                <button onclick="sendChat()">Kirim</button>
            </div>
            
            <div class="emote-picker" id="emotePicker">
                <img src="https://i.pinimg.com/originals/74/45/ea/7445ea6eb82845347209930f36f33290.png" onclick="sendEmote('https://i.pinimg.com/originals/74/45/ea/7445ea6eb82845347209930f36f33290.png')">
                <img src="https://i.pinimg.com/originals/44/1a/10/441a1005a0d33e5ddc9557b4f5351a02.png" onclick="sendEmote('https://i.pinimg.com/originals/44/1a/10/441a1005a0d33e5ddc9557b4f5351a02.png')">
                <img src="https://i.pinimg.com/originals/bc/26/5d/bc265de83df4dcd309d424b9bbdcf2dd.png" onclick="sendEmote('https://i.pinimg.com/originals/bc/26/5d/bc265de83df4dcd309d424b9bbdcf2dd.png')">
                <img src="https://i.pinimg.com/originals/30/1e/8f/301e8f237ef3900293da2c2a05d8f6cc.png" onclick="sendEmote('https://i.pinimg.com/originals/30/1e/8f/301e8f237ef3900293da2c2a05d8f6cc.png')">
            </div>
            <div class="char-counter" id="charCounter">0/50</div>
        </div>
    </div>

    <button class="nav-float-btn" id="navToggleBtn" onclick="togglePage()">🌍</button>

    <!-- MODAL SETTINGS -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Atur Profil</h3>
            <div class="input-group" style="margin:0;">
                <label>Nama Akun:</label>
                <input type="text" id="inputNewName" oninput="checkNameForPin()">
            </div>
            <div class="input-group" id="pinInputGroup" style="display: none; margin:0; margin-top: 10px;">
                <label style="color: #ff3333;">PIN Khusus Admin:</label>
                <input type="password" id="inputAdminPin" placeholder="PIN...">
            </div>
            <div class="input-group" style="margin:0; margin-top: 10px;">
                <label>Foto Profil (Pilih File):</label>
                <input type="file" id="inputFileAvatar" accept="image/*" style="font-size: 13px; color:#ccc;">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeSettings()">Batal</button>
                <button class="btn-save" onclick="saveSettings()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL FEEDBACK -->
    <div class="modal" id="feedbackModal">
        <div class="modal-content">
            <h3 style="color: #00c6ff;">💡 Kirim Saran Fitur</h3>
            <p style="font-size: 12px; color: #aaa; text-align: center;">Pesan akan langsung masuk ke Kotak Masuk Admin.</p>
            <textarea id="feedbackInput" rows="4" placeholder="Ketik saran atau ide fitur baru di sini..."></textarea>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="document.getElementById('feedbackModal').style.display='none'">Batal</button>
                <button class="btn-save" style="background: #00c6ff;" onclick="submitFeedback()">Kirim Saran</button>
            </div>
        </div>
    </div>

    <!-- MODAL ADMIN -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width: 450px;">
            <h3 style="color: #ff3333;">🛡️ Panel Admin Spesial</h3>
            
            <div class="admin-box">
                <h4 style="font-size: 13px; color:#aaa; margin-bottom: 8px;">1. Moderasi Global Chat</h4>
                <button class="btn-cancel" style="background: #cc0000; color: white; width: 100%; padding: 8px; font-size:12px; margin-bottom: 8px;" onclick="deleteAllChats()">🗑️ KOSONGKAN SEMUA CHAT</button>
                <div id="adminChatList" style="display: flex; flex-direction: column; gap: 5px; max-height: 150px; overflow-y: auto;"></div>
            </div>

            <div class="admin-box">
                <h4 style="font-size: 13px; color:#00c6ff; margin-bottom: 8px;">2. Kotak Masuk Saran (Feedback)</h4>
                <div id="adminFeedbackList" style="display: flex; flex-direction: column; gap: 5px; max-height: 150px; overflow-y: auto;">
                    <p style="font-size:11px; color:#666;">Memuat saran...</p>
                </div>
            </div>

            <button class="btn-cancel" onclick="closeAdminPanel()" style="width: 100%;">Tutup Panel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, remove, onChildRemoved, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBNc_H9SA7WrIagS8f-5uHggeU7ODia7Q",
            authDomain: "qrtes12.firebaseapp.com",
            databaseURL: "https://qrtes12-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "qrtes12",
            storageBucket: "qrtes12.firebasestorage.app",
            messagingSenderId: "993597353524",
            appId: "1:993597353524:web:151391426bf44c22aee461"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DAFTAR ADMIN (Bisa ditambah)
        const ADMIN_USERS = ["Xenaz"];
        const ADMIN_PIN = "040611";

        let currentUser = localStorage.getItem('ml_username') || ("guest" + Math.floor(100 + Math.random() * 900));
        let currentAvatar = localStorage.getItem('ml_avatar') || "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png";
        let isAdmin = localStorage.getItem('isAdmin') === 'true';

        localStorage.setItem('ml_username', currentUser);
        localStorage.setItem('ml_avatar', currentAvatar);

        function updateHeaderUI() {
            let userHTML = escapeHtml(currentUser);
            if (ADMIN_USERS.includes(currentUser) && isAdmin) {
                userHTML += ` <span class="badge-adm">[ADM]</span>`;
                document.getElementById('adminPanelBtn').style.display = 'block';
            } else {
                document.getElementById('adminPanelBtn').style.display = 'none';
            }
            document.getElementById('headerUsername').innerHTML = userHTML;
            document.getElementById('headerAvatar').src = currentAvatar;
        }
        updateHeaderUI();

        window.openSettings = () => { document.getElementById('inputNewName').value = currentUser; checkNameForPin(); document.getElementById('settingsModal').style.display = 'flex'; }
        window.closeSettings = () => { document.getElementById('settingsModal').style.display = 'none'; }
        window.checkNameForPin = () => { document.getElementById('pinInputGroup').style.display = ADMIN_USERS.includes(document.getElementById('inputNewName').value.trim()) ? 'block' : 'none'; }
        
        window.saveSettings = () => {
            let newName = document.getElementById('inputNewName').value.trim();
            if (ADMIN_USERS.includes(newName)) {
                if (document.getElementById('inputAdminPin').value !== ADMIN_PIN) return alert("PIN Admin Salah!");
                isAdmin = true; localStorage.setItem('isAdmin', 'true'); alert("Login Admin Berhasil!");
            } else { isAdmin = false; localStorage.setItem('isAdmin', 'false'); }

            if (newName) { currentUser = newName; localStorage.setItem('ml_username', currentUser); updateHeaderUI(); }

            let file = document.getElementById('inputFileAvatar').files[0];
            if (file) {
                let r = new FileReader(); r.onload = (e) => {
                    currentAvatar = e.target.result; localStorage.setItem('ml_avatar', currentAvatar);
                    updateHeaderUI(); location.reload();
                }; r.readAsDataURL(file);
            } else { closeSettings(); location.reload(); }
        }

        // NAVIGASI
        let isChatActive = false;
        window.togglePage = () => {
            isChatActive = !isChatActive;
            document.getElementById('calcPage').style.display = isChatActive ? 'none' : 'block';
            document.getElementById('chatPage').style.display = isChatActive ? 'flex' : 'none';
            document.getElementById('navToggleBtn').innerText = isChatActive ? '%' : '🌍';
        }

        // FITUR FEEDBACK
        window.openFeedback = () => document.getElementById('feedbackModal').style.display = 'flex';
        window.submitFeedback = () => {
            let msg = document.getElementById('feedbackInput').value.trim();
            if (!msg) return;
            push(ref(db, 'feedbacks'), { username: currentUser, message: msg, timestamp: Date.now() }).then(() => {
                alert("Terima kasih! Saranmu telah dikirim ke Admin.");
                document.getElementById('feedbackInput').value = '';
                document.getElementById('feedbackModal').style.display = 'none';
            });
        }

        /* --- SISTEM ANTI-SPAM & FILTER KATA KASAR --- */
        let chatTimestamps = [];
        const KATA_KASAR = ['anjing', 'babi', 'goblok', 'tolol', 'bangsat', 'kontol', 'memek', 'ngentot', 'puki', 'bego'];

        function cekHukumanMute() {
            let muteEnd = localStorage.getItem('mute_until');
            if (muteEnd && Date.now() < parseInt(muteEnd)) {
                let sisa = Math.ceil((parseInt(muteEnd) - Date.now()) / 60000);
                alert(`🔇 Kamu sedang di-mute! Tunggu ${sisa} menit lagi karena melanggar aturan chat.`);
                return true;
            }
            return false;
        }

        function terapkanMute(alasan) {
            let muteEnd = Date.now() + (5 * 60 * 1000); // 5 Menit
            localStorage.setItem('mute_until', muteEnd);
            alert(`🚫 HUKUMAN: Kamu di-mute selama 5 menit!\nAlasan: ${alasan}`);
        }

        // SISTEM CHAT
        let activeReplyData = null;
        window.prepareReply = (u, m) => { activeReplyData = { username: u, message: m }; document.getElementById('replyPreviewUser').innerText = "@" + u; document.getElementById('replyPreviewText').innerText = m; document.getElementById('replyPreviewBox').style.display = 'block'; document.getElementById('chatInput').focus(); }
        window.cancelReply = () => { activeReplyData = null; document.getElementById('replyPreviewBox').style.display = 'none'; }
        window.toggleEmotePicker = () => { let p = document.getElementById('emotePicker'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex'; }
        
        window.sendEmote = (url) => {
            if (cekHukumanMute()) return;
            push(ref(db, 'global_chats'), { username: currentUser, avatar: currentAvatar, message: "", emoteUrl: url, timestamp: Date.now() });
            document.getElementById('emotePicker').style.display = 'none';
        }
        window.updateCharCount = () => { let t = document.getElementById('chatInput'); if(t.value.length>50) t.value=t.value.substring(0,50); document.getElementById('charCounter').innerText = t.value.length + "/50"; }

        window.sendChat = () => {
            if (cekHukumanMute()) return;

            let text = document.getElementById('chatInput').value.trim();
            if (!text) return;

            // 1. Cek Kata Kasar
            let lowerText = text.toLowerCase();
            let isKasar = KATA_KASAR.some(word => lowerText.includes(word));
            if (isKasar) {
                document.getElementById('chatInput').value = '';
                terapkanMute("Mengirim kata kasar/toxic.");
                return; // Batalkan kirim chat
            }

            // 2. Cek Spam (5 pesan dalam 5 detik)
            let now = Date.now();
            chatTimestamps.push(now);
            if (chatTimestamps.length > 5) chatTimestamps.shift();
            if (chatTimestamps.length === 5 && (now - chatTimestamps[0] < 5000)) {
                document.getElementById('chatInput').value = '';
                terapkanMute("Spamming pesan terlalu cepat.");
                chatTimestamps = []; // Reset spam counter
                return;
            }

            let payload = { username: currentUser, avatar: currentAvatar, message: text, timestamp: now };
            if (activeReplyData) payload.reply = activeReplyData;

            push(ref(db, 'global_chats'), payload).then(() => {
                document.getElementById('chatInput').value = ''; document.getElementById('charCounter').innerText = '0/50'; cancelReply();
            });
        }

        // PANEL ADMIN
        window.openAdminPanel = () => document.getElementById('adminModal').style.display = 'flex';
        window.closeAdminPanel = () => document.getElementById('adminModal').style.display = 'none';
        window.deleteMessage = (key) => { if(confirm("Hapus pesan?")) remove(ref(db, 'global_chats/' + key)); }
        window.deleteAllChats = () => { if(confirm("🚨 HAPUS SEMUA CHAT?")) remove(ref(db, 'global_chats')); }

        // LISTENER CHAT & FEEDBACK (REALTIME)
        const chatMessagesDiv = document.getElementById('chatMessages');
        const adminChatList = document.getElementById('adminChatList');
        const adminFbList = document.getElementById('adminFeedbackList');
        
        onValue(ref(db, 'global_chats'), (s) => { if(!s.exists()) { chatMessagesDiv.innerHTML=''; adminChatList.innerHTML=''; }});
        
        onChildAdded(ref(db, 'global_chats'), (s) => {
            let data = s.val(); let key = s.key;
            let isAdminChat = ADMIN_USERS.includes(data.username);
            let badgeHTML = isAdminChat ? ` <span class="badge-adm">[ADM]</span>` : '';
            
            let bubble = document.createElement('div'); bubble.className = 'chat-bubble'; bubble.id = 'msg-' + key;
            let replyHTML = data.reply ? `<div class="chat-quoted"><b>@${escapeHtml(data.reply.username)}</b><br>${escapeHtml(data.reply.message)}</div>` : '';
            let msgContent = data.emoteUrl ? `<img src="${data.emoteUrl}" class="chat-emote">` : `<span class="chat-text">${escapeHtml(data.message)}</span>`;
            
            bubble.innerHTML = `
                <div class="chat-user-info" style="width:100%;">
                    <img class="ava" src="${data.avatar || 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f464.png'}">
                    <div class="chat-content" style="flex:1;">
                        <span class="chat-user">${escapeHtml(data.username)}${badgeHTML}</span>
                        ${replyHTML}${msgContent}
                        <div class="action-row">
                            <button class="btn-reply" onclick="prepareReply('${escapeHtml(data.username)}', '${data.emoteUrl ? '[Stiker]' : escapeHtml(data.message)}')">Balas ↩</button>
                            ${(ADMIN_USERS.includes(currentUser) && isAdmin) ? `<button class="delete-msg-btn" style="display:block;" onclick="deleteMessage('${key}')">Hapus</button>` : ''}
                        </div>
                    </div>
                </div>`;
            chatMessagesDiv.appendChild(bubble); chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;

            if (ADMIN_USERS.includes(currentUser) && isAdmin) {
                let adminItem = document.createElement('div'); adminItem.className = 'admin-chat-item'; adminItem.id = 'admin-msg-' + key;
                adminItem.innerHTML = `<span><b>${escapeHtml(data.username)}:</b> ${data.emoteUrl?'[Emote]':escapeHtml(data.message)}</span><button class="delete-msg-btn" style="display:block; background:#666;" onclick="deleteMessage('${key}')">X</button>`;
                adminChatList.appendChild(adminItem);
            }
        });
        onChildRemoved(ref(db, 'global_chats'), (s) => {
            let b = document.getElementById('msg-'+s.key); if(b) b.remove();
            let a = document.getElementById('admin-msg-'+s.key); if(a) a.remove();
        });

        // Tampilkan Feedback khusus Admin
        onValue(ref(db, 'feedbacks'), (s) => {
            if (ADMIN_USERS.includes(currentUser) && isAdmin) {
                adminFbList.innerHTML = '';
                if (!s.exists()) { adminFbList.innerHTML = '<p style="font-size:11px; color:#666;">Belum ada saran masuk.</p>'; return; }
                s.forEach((child) => {
                    let d = child.val();
                    let dateStr = new Date(d.timestamp).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                    adminFbList.innerHTML += `<div class="admin-fb-item"><b>@${escapeHtml(d.username)}</b> <span class="fb-date">${dateStr}</span><br><span style="color:#ddd; display:block; margin-top:4px;">"${escapeHtml(d.message)}"</span></div>`;
                });
            }
        });

        function escapeHtml(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>

    <!-- LOGIKA KALKULATOR WR + SIMULASI LOSE -->
    <script>
        function hitungWR() {
            let totalMatch = parseFloat(document.getElementById('totalMatch').value);
            let currentWR = parseFloat(document.getElementById('currentWR').value);
            let targetWR = parseFloat(document.getElementById('targetWR').value);
            let loseStreak = parseFloat(document.getElementById('loseStreak').value) || 0; // Simulasi kalah

            if (!totalMatch || !currentWR || !targetWR) return alert("Harap isi semua kolom match dan WR!");
            if (currentWR > 100 || targetWR > 100) return alert("Win Rate maksimal 100%!");

            let totalWin = Math.round(totalMatch * (currentWR / 100));
            let totalLose = totalMatch - totalWin;

            // Output Hasil Dasar
            document.getElementById('winLoseResult').innerHTML = `Saat ini: <span class="highlight">${totalMatch}</span> match, WR <span class="highlight">${currentWR}%</span><br>• Menang: <span class="highlight">${totalWin}</span> | Kalah: <span class="highlight">${totalLose}</span>`;

            // Simulasi Jika Kalah Berturut-turut
            let simulatedMatch = totalMatch + loseStreak;
            let simulatedLose = totalLose + loseStreak;
            let simulatedWR = (totalWin / simulatedMatch) * 100;

            if (loseStreak > 0) {
                document.getElementById('simulationResult').style.display = 'block';
                document.getElementById('simulationResult').innerHTML = `📉 <b>Jika Lose Streak ${loseStreak}x:</b><br>Total Match menjadi ${simulatedMatch}<br>Win Rate kamu akan turun drastis menjadi <span class="highlight-red">${simulatedWR.toFixed(2)}%</span>`;
            } else {
                document.getElementById('simulationResult').style.display = 'none';
            }

            // Hitung Butuh Win (Berdasarkan Simulasi Terakhir)
            let targetResultText = "";
            if (targetWR <= simulatedWR) { 
                targetResultText = `Kamu sudah mencapai/melewati target WR <span class="highlight">${targetWR}%</span>.`;
            } else if (targetWR === 100 && simulatedLose > 0) { 
                targetResultText = `Tidak mungkin mencapai WR 100% karena kamu memiliki sejarah kalah.`;
            } else {
                let tWR = targetWR / 100;
                let butuhWin = Math.ceil(((tWR * simulatedMatch) - totalWin) / (1 - tWR));
                targetResultText = `Dari posisi ini, kamu butuh <b>kurang lebih <span class="highlight">${butuhWin}</span> kemenangan tanpa kalah</b> beruntun untuk naik ke WR <span class="highlight">${targetWR}%</span>.`;
            }

            document.getElementById('targetResult').innerHTML = targetResultText; 
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
